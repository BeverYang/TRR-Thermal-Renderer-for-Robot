<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <meta name="theme-color" content="#0a0806">
    <link rel="icon" href="{{ '/assets/thermal-mark.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="page-shell px-3 my-5 markdown-body">
      {{ content }}

      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRHK6WZhUHz2qd3AdBu45XFYp7woThtE0tBt7j7tQ=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
